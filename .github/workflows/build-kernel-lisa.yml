name: Build SukiSU-Ultra Kernel (lisa)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: "Kernel source repo (HTTPS) — must contain build.sh"
        required: true
        default: "https://github.com/AcmeUI-Devices/android_kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "main"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch (main / builtin)"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - builtin
      DEFCONFIG:
        description: "Defconfig name (relative to arch/arm64/configs/)"
        required: true
        default: "vendor/lisa_defconfig"
      CLANG_URL:
        description: "Clang toolchain tarball URL"
        required: true
        default: "https://github.com/ZyCromerZ/Clang/releases/download/21.0.0-20250517-release/Clang-21.0.0-20250517.tar.gz"
      BUILD_ARGS:
        description: "Extra arguments to pass to kernel build.sh (optional)"
        required: false
        default: ""
      ENABLE_KPM:
        description: "Enable KPM support"
        required: false
        default: true
        type: boolean
      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean
      SUSFS_REPO:
        description: "SUSFS repo (ShirkNeko fork recommended for SukiSU-Ultra)"
        required: false
        default: "https://github.com/ShirkNeko/susfs4ksu"
      SUSFS_BRANCH:
        description: "SUSFS branch (must match kernel version)"
        required: false
        default: "kernel-5.4"
      ANYKERNEL_REPO:
        description: "AnyKernel3 repo"
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ── checkout this repo ──
      - name: Checkout builder repo
        uses: actions/checkout@v4

      # ── install dependencies ──
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git gnupg libelf-dev libssl-dev lld llvm \
            python3 python-is-python3 zip unzip wget \
            device-tree-compiler gcc-aarch64-linux-gnu

      # ── setup Clang ──
      - name: Setup Clang toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          echo ">>> Downloading Clang..."
          wget -q "${{ github.event.inputs.CLANG_URL }}" -O clang.tar.gz
          tar -xf clang.tar.gz -C $GITHUB_WORKSPACE/toolchain/clang --strip-components=1
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
          echo ">>> Clang version:"
          $GITHUB_WORKSPACE/toolchain/clang/bin/clang --version || true

      # ── clone kernel source ──
      - name: Clone kernel source
        run: |
          echo ">>> Cloning: ${{ github.event.inputs.KERNEL_REPO }} @ ${{ github.event.inputs.KERNEL_BRANCH }}"
          git clone --depth=1 \
            -b "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_REPO }}" \
            $GITHUB_WORKSPACE/kernel
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV

          if [ -f "$GITHUB_WORKSPACE/kernel/build.sh" ]; then
            echo ">>> ✅ build.sh found."
          else
            echo "::error::build.sh NOT found in kernel source!"
            ls -la $GITHUB_WORKSPACE/kernel/
            exit 1
          fi

      # ── integrate SukiSU-Ultra ──
      - name: Integrate SukiSU-Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> Integrating SukiSU-Ultra (${{ github.event.inputs.SUKISU_BRANCH }})..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.SUKISU_BRANCH }}"
          echo ">>> SukiSU-Ultra integration done."

          # Detect KSU directory name (drivers/kernelsu or KernelSU/kernel)
          if [ -d "drivers/kernelsu" ]; then
            echo "KSU_DIR=drivers/kernelsu" >> $GITHUB_ENV
            echo ">>> KSU directory: drivers/kernelsu"
          elif [ -d "KernelSU/kernel" ]; then
            echo "KSU_DIR=KernelSU/kernel" >> $GITHUB_ENV
            echo ">>> KSU directory: KernelSU/kernel"
          else
            echo "KSU_DIR=" >> $GITHUB_ENV
            echo "::warning::KSU directory not found!"
          fi

      # ══════════════════════════════════════════════════
      # SUSFS Integration (ENABLED by default)
      # ══════════════════════════════════════════════════
      - name: Integrate SUSFS
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "============================================"
          echo ">>> Integrating SUSFS"
          echo ">>> Repo:   ${{ github.event.inputs.SUSFS_REPO }}"
          echo ">>> Branch: ${{ github.event.inputs.SUSFS_BRANCH }}"
          echo "============================================"

          # 1. Clone susfs4ksu
          git clone --depth=1 -b "${{ github.event.inputs.SUSFS_BRANCH }}" \
            "${{ github.event.inputs.SUSFS_REPO }}" \
            $GITHUB_WORKSPACE/susfs4ksu
          SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"

          echo ">>> SUSFS repo contents:"
          ls -la "$SUSFS_DIR/kernel_patches/" 2>/dev/null || echo "  (no kernel_patches dir)"

          # 2. Copy SUSFS source files into kernel tree
          echo ">>> Step 2: Copying SUSFS source files..."

          # Copy fs/susfs.c
          if [ -f "$SUSFS_DIR/kernel_patches/fs/susfs.c" ]; then
            cp -v "$SUSFS_DIR/kernel_patches/fs/susfs.c" fs/susfs.c
            echo "    ✅ fs/susfs.c"
          elif [ -d "$SUSFS_DIR/kernel_patches/fs" ]; then
            cp -rv "$SUSFS_DIR/kernel_patches/fs/"* fs/ 2>/dev/null || true
            echo "    ✅ fs/ (all files)"
          fi

          # Copy include/linux/susfs.h
          if [ -f "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" ]; then
            mkdir -p include/linux
            cp -v "$SUSFS_DIR/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
            echo "    ✅ include/linux/susfs.h"
          elif [ -d "$SUSFS_DIR/kernel_patches/include" ]; then
            cp -rv "$SUSFS_DIR/kernel_patches/include/"* include/ 2>/dev/null || true
            echo "    ✅ include/ (all files)"
          fi

          # 3. Apply KSU-specific SUSFS patch (10_enable_susfs_for_ksu.patch)
          echo ""
          echo ">>> Step 3: Applying SUSFS KSU patches..."
          KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches/KernelSU"
          if [ ! -d "$KSU_PATCH_DIR" ]; then
            # Some repos structure differently
            KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches"
          fi

          # Find and apply the KSU enablement patch
          KSU_APPLIED=false
          for patch_file in \
            "$KSU_PATCH_DIR/10_enable_susfs_for_ksu.patch" \
            "$KSU_PATCH_DIR/"*enable_susfs*.patch \
            "$KSU_PATCH_DIR/"*ksu*.patch; do
            [ -f "$patch_file" ] || continue
            echo "    >>> Trying: $(basename $patch_file)"

            # Try applying to KSU directory
            if [ -n "$KSU_DIR" ]; then
              if git apply --check --directory="$KSU_DIR" "$patch_file" 2>/dev/null; then
                git apply --directory="$KSU_DIR" "$patch_file"
                echo "    ✅ Applied to $KSU_DIR"
                KSU_APPLIED=true
                break
              fi
              # Try without --directory (patch may have full paths)
              if git apply --check "$patch_file" 2>/dev/null; then
                git apply "$patch_file"
                echo "    ✅ Applied (full path)"
                KSU_APPLIED=true
                break
              fi
              # Try with --reject for partial apply
              echo "    ⚠️ Clean apply failed, trying with --reject..."
              git apply --reject "$patch_file" 2>/dev/null || true
              KSU_APPLIED=true
              break
            fi
          done

          if [ "$KSU_APPLIED" = false ]; then
            echo "    ⚠️ No KSU SUSFS patch applied (may already be built-in for SukiSU-Ultra builtin branch)"
          fi

          # 4. Apply kernel-level SUSFS patch (50_add_susfs_in_kernel-5.4.patch)
          echo ""
          echo ">>> Step 4: Applying kernel SUSFS patches..."
          KERNEL_APPLIED=false
          for patch_file in \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" \
            "$SUSFS_DIR/kernel_patches/"*add_susfs*.patch \
            "$SUSFS_DIR/kernel_patches/"*kernel*.patch; do
            [ -f "$patch_file" ] || continue
            # Skip KSU patches (already handled above)
            echo "$patch_file" | grep -qiE "ksu|enable_susfs_for_ksu" && continue
            echo "    >>> Trying: $(basename $patch_file)"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file"
              echo "    ✅ Applied: $(basename $patch_file)"
              KERNEL_APPLIED=true
            else
              echo "    ⚠️ Clean apply failed, trying with --reject..."
              git apply --reject "$patch_file" 2>/dev/null || true
              KERNEL_APPLIED=true
            fi
          done

          if [ "$KERNEL_APPLIED" = false ]; then
            echo "    ⚠️ No kernel SUSFS patch found/applied"
          fi

          # 5. Verify SUSFS integration
          echo ""
          echo ">>> Step 5: Verification..."
          SUSFS_OK=true

          if [ -f "include/linux/susfs.h" ]; then
            echo "    ✅ include/linux/susfs.h exists"
          else
            echo "    ❌ include/linux/susfs.h MISSING"
            SUSFS_OK=false
          fi

          if [ -f "fs/susfs.c" ]; then
            echo "    ✅ fs/susfs.c exists"
          else
            echo "    ❌ fs/susfs.c MISSING"
            SUSFS_OK=false
          fi

          # Check if susfs.h defines SUSFS_MAGIC
          if grep -q "SUSFS_MAGIC" include/linux/susfs.h 2>/dev/null; then
            echo "    ✅ SUSFS_MAGIC found in susfs.h"
          else
            echo "    ⚠️ SUSFS_MAGIC not found in susfs.h (may cause build errors)"
          fi

          # Check for key functions
          for sym in susfs_add_sus_path susfs_set_uname susfs_add_sus_kstat; do
            if grep -rq "$sym" include/linux/susfs.h fs/susfs.c 2>/dev/null; then
              echo "    ✅ $sym defined"
            else
              echo "    ⚠️ $sym not found"
            fi
          done

          # List .rej files if any
          REJ_FILES=$(find . -name "*.rej" 2>/dev/null)
          if [ -n "$REJ_FILES" ]; then
            echo ""
            echo "    ⚠️ Rejected hunks found:"
            echo "$REJ_FILES" | while read f; do
              echo "      - $f"
              cat "$f"
            done
          fi

          if [ "$SUSFS_OK" = true ]; then
            echo ""
            echo ">>> ✅ SUSFS integration complete."
          else
            echo ""
            echo ">>> ⚠️ SUSFS integration incomplete — build may fail."
            echo ">>> Consider setting ENABLE_SUSFS=false if errors persist."
          fi

      # ── SUSFS stub if disabled ──
      - name: Handle SUSFS header (disabled)
        if: ${{ github.event.inputs.ENABLE_SUSFS != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> SUSFS disabled. Creating stub header..."
          mkdir -p include/linux
          cat > include/linux/susfs.h << 'EOF'
          #ifndef _LINUX_SUSFS_H
          #define _LINUX_SUSFS_H
          /* SUSFS stub — feature disabled */
          #endif
          EOF
          echo ">>> Created stub include/linux/susfs.h"

      # ── apply manual hook patches ──
      - name: Apply manual hook patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x $GITHUB_WORKSPACE/apply_hooks.sh
          bash $GITHUB_WORKSPACE/apply_hooks.sh

      # ── fix vendor code build errors ──
      - name: Fix vendor code build errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e
          echo ">>> Fixing vendor code build errors..."

          # FIX: rmnet_ipa.c enum conversion
          RMNET_IPA="techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/rmnet_ipa.c"
          if [ -f "$RMNET_IPA" ]; then
            sed -i 's/q6_ul_flt_rule_ptr->ip = flt_spec_ptr->ip_type;/q6_ul_flt_rule_ptr->ip = (enum ipa_ip_type)flt_spec_ptr->ip_type;/g' "$RMNET_IPA"
            sed -i 's/q6_ul_flt_rule_ptr->action = flt_spec_ptr->filter_action;/q6_ul_flt_rule_ptr->action = (enum ipa_flt_action)flt_spec_ptr->filter_action;/g' "$RMNET_IPA"
            echo "    [OK] rmnet_ipa.c enum casts"
          fi

          # FIX: sde_hw_dsc_1_2.c missing return type
          SDE_DSC="techpack/display/msm/sde/sde_hw_dsc_1_2.c"
          if [ -f "$SDE_DSC" ]; then
            sed -i 's/^static inline _dsc_subblk_offset/static inline int _dsc_subblk_offset/g' "$SDE_DSC"
            echo "    [OK] sde_hw_dsc_1_2.c return type fix"
          fi

          echo ">>> Vendor fixes applied."

      # ── update defconfig ──
      - name: Update defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"
          echo ">>> Updating defconfig: $DEFCONFIG_PATH"

          # Remove ALL KSU/SUSFS/KPM related entries
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KPROBES/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KPM/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KALLSYMS_ALL/d' "$DEFCONFIG_PATH"

          # Core KSU configs
          {
            echo ""
            echo "# --- SukiSU-Ultra ---"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KPROBES is not set"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DEFCONFIG_PATH"

          # KPM
          if [ "${{ github.event.inputs.ENABLE_KPM }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
            echo ">>> KPM enabled."
          fi

          # SUSFS
          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ]; then
            {
              echo "# --- SUSFS ---"
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "# CONFIG_KSU_SUSFS_SUS_SU is not set"
            } >> "$DEFCONFIG_PATH"
            echo ">>> SUSFS enabled (SUS_SU disabled for manual hooks)."
          else
            {
              echo "# --- SUSFS (disabled) ---"
              echo "# CONFIG_KSU_SUSFS is not set"
            } >> "$DEFCONFIG_PATH"
            echo ">>> SUSFS disabled."
          fi

          echo ""
          echo "--- Tail of defconfig ---"
          tail -25 "$DEFCONFIG_PATH"

      # ── build kernel ──
      - name: Build kernel via build.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "============================================"
          echo ">>> Building kernel via build.sh"
          echo "============================================"

          chmod +x build.sh

          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain/clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export KERNEL_DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/clang"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain/clang"
          export TC_DIR="$GITHUB_WORKSPACE/toolchain/clang"

          BUILD_START=$(date +%s)

          bash build.sh ${{ github.event.inputs.BUILD_ARGS }} 2>&1 | tee $GITHUB_WORKSPACE/build.log
          BUILD_RC=${PIPESTATUS[0]}

          BUILD_END=$(date +%s)
          BUILD_ELAPSED=$(( BUILD_END - BUILD_START ))
          echo ""
          echo ">>> Build time: $((BUILD_ELAPSED/60))m $((BUILD_ELAPSED%60))s (exit: $BUILD_RC)"

          if [ $BUILD_RC -ne 0 ]; then
            echo "::error::Kernel build FAILED!"
            exit $BUILD_RC
          fi
        env:
          KERNEL_DIR: ${{ env.KERNEL_DIR }}

      # ── locate kernel image ──
      - name: Locate kernel image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KERNEL_IMAGE=""
          for search_dir in "out/arch/arm64/boot" "arch/arm64/boot" "out/dist"; do
            for img in Image Image.gz Image.gz-dtb; do
              [ -f "$search_dir/$img" ] && KERNEL_IMAGE="$(realpath "$search_dir/$img")" && break 2
            done
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel image found!"
            find . -name "Image*" -type f 2>/dev/null | head -10
            exit 1
          fi

          echo ">>> ✅ Image: $KERNEL_IMAGE ($(du -h "$KERNEL_IMAGE" | cut -f1))"
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> $GITHUB_ENV
          echo "OUT_BASE=$(dirname "$(dirname "$(dirname "$KERNEL_IMAGE")")")" >> $GITHUB_ENV

      # ── package AnyKernel3 ──
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 "${{ github.event.inputs.ANYKERNEL_REPO }}" $GITHUB_WORKSPACE/AnyKernel3
          cp $GITHUB_WORKSPACE/anykernel.sh $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          cp "$KERNEL_IMAGE" $GITHUB_WORKSPACE/AnyKernel3/

          for dts_dir in "$OUT_BASE/arch/arm64/boot/dts" "$KERNEL_DIR/out/arch/arm64/boot/dts"; do
            [ -d "$dts_dir" ] && find "$dts_dir" -name "*.dtb" -exec cp {} $GITHUB_WORKSPACE/AnyKernel3/ \; 2>/dev/null && break
          done
          for dtbo in "$OUT_BASE/arch/arm64/boot/dtbo.img" "$KERNEL_DIR/out/arch/arm64/boot/dtbo.img"; do
            [ -f "$dtbo" ] && cp "$dtbo" $GITHUB_WORKSPACE/AnyKernel3/ && break
          done

          cd $GITHUB_WORKSPACE/AnyKernel3
          rm -rf .git .github LICENSE README.md

          SUSFS_TAG=""
          [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ] && SUSFS_TAG="-SUSFS"
          ZIPNAME="SukiSU-Ultra${SUSFS_TAG}-lisa-$(date +%Y%m%d-%H%M)-AnyKernel3.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIPNAME" . -x '*.git*'
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          echo ">>> ✅ $ZIPNAME"
        env:
          KERNEL_DIR: ${{ env.KERNEL_DIR }}
          KERNEL_IMAGE: ${{ env.KERNEL_IMAGE }}
          OUT_BASE: ${{ env.OUT_BASE }}

      # ── upload artifacts ──
      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ github.workspace }}/${{ env.ZIPNAME }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
