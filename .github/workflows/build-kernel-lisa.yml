name: Build SukiSU-Ultra Kernel (lisa)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: "Kernel source repo (must contain build.sh)"
        required: true
        default: "https://github.com/AcmeUI-Devices/android_kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "main"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - builtin
      DEFCONFIG:
        description: "Defconfig (relative to arch/arm64/configs/)"
        required: true
        default: "vendor/lisa_defconfig"
      CLANG_URL:
        description: "Clang toolchain tarball URL"
        required: true
        default: "https://github.com/ZyCromerZ/Clang/releases/download/21.0.0-20250517-release/Clang-21.0.0-20250517.tar.gz"
      BUILD_ARGS:
        description: "Extra build.sh arguments"
        required: false
        default: ""
      ENABLE_KPM:
        description: "Enable KPM"
        required: false
        default: true
        type: boolean
      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean
      SUSFS_REPO:
        description: "SUSFS repo"
        required: false
        default: "https://github.com/ShirkNeko/susfs4ksu"
      SUSFS_BRANCH:
        description: "SUSFS branch"
        required: false
        default: "kernel-5.4"
      ANYKERNEL_REPO:
        description: "AnyKernel3 repo"
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git gnupg libelf-dev libssl-dev lld llvm \
            python3 python-is-python3 zip unzip wget \
            device-tree-compiler gcc-aarch64-linux-gnu

      - name: Setup Clang toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          wget -q "${{ github.event.inputs.CLANG_URL }}" -O clang.tar.gz
          tar -xf clang.tar.gz -C $GITHUB_WORKSPACE/toolchain/clang --strip-components=1
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_REPO }}" \
            $GITHUB_WORKSPACE/kernel
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV
          [ -f "$GITHUB_WORKSPACE/kernel/build.sh" ] || { echo "::error::build.sh not found!"; exit 1; }

      - name: Integrate SukiSU-Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.SUKISU_BRANCH }}"
          if [ -d "drivers/kernelsu" ]; then echo "KSU_DIR=drivers/kernelsu" >> $GITHUB_ENV
          elif [ -d "KernelSU/kernel" ]; then echo "KSU_DIR=KernelSU/kernel" >> $GITHUB_ENV
          else echo "KSU_DIR=" >> $GITHUB_ENV; fi

      - name: Integrate SUSFS
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> Cloning SUSFS (${{ github.event.inputs.SUSFS_BRANCH }})..."
          git clone --depth=1 -b "${{ github.event.inputs.SUSFS_BRANCH }}" \
            "${{ github.event.inputs.SUSFS_REPO }}" $GITHUB_WORKSPACE/susfs4ksu
          SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"

          echo ">>> Copying files..."
          [ -d "$SUSFS_DIR/kernel_patches/fs" ] && cp -rv "$SUSFS_DIR/kernel_patches/fs/"* fs/
          [ -d "$SUSFS_DIR/kernel_patches/include" ] && cp -rv "$SUSFS_DIR/kernel_patches/include/"* include/
          ls -la include/linux/susfs* 2>/dev/null || true

          echo ">>> Applying KSU SUSFS patch..."
          KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches/KernelSU"
          [ ! -d "$KSU_PATCH_DIR" ] && KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches"
          for p in "$KSU_PATCH_DIR/"*enable_susfs*.patch; do
            [ -f "$p" ] || continue
            echo "    Trying: $(basename $p)"
            git apply --check "$p" 2>/dev/null && git apply "$p" && echo "    ✅ Applied" && break
            git apply --check --directory="${{ env.KSU_DIR }}" "$p" 2>/dev/null && \
              git apply --directory="${{ env.KSU_DIR }}" "$p" && echo "    ✅ Applied to KSU" && break
            echo "    ⚠️ Apply with --reject..."
            git apply --reject "$p" 2>/dev/null || true; break
          done

          echo ">>> Applying kernel SUSFS patch..."
          for p in "$SUSFS_DIR/kernel_patches/"*add_susfs*.patch "$SUSFS_DIR/kernel_patches/"*kernel*.patch; do
            [ -f "$p" ] || continue
            echo "$p" | grep -qiE "ksu|enable_susfs_for_ksu" && continue
            echo "    Trying: $(basename $p)"
            git apply --check "$p" 2>/dev/null && git apply "$p" && echo "    ✅ Applied" || \
              { echo "    ⚠️ --reject..."; git apply --reject "$p" 2>/dev/null || true; }
          done

          echo ">>> Verification:"
          [ -f "include/linux/susfs.h" ] && echo "    ✅ susfs.h" || echo "    ❌ susfs.h"
          [ -f "fs/susfs.c" ] && echo "    ✅ susfs.c" || echo "    ❌ susfs.c"
          find . -name "*.rej" 2>/dev/null | head -5 | while read f; do echo "    ⚠️ Reject: $f"; done

      # ════════════════════════════════════════════
      #  FIX ALL SUSFS/KSU missing symbols
      #  Direct patching — no external scripts
      # ════════════════════════════════════════════
      - name: Fix SUSFS/KSU missing symbols
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e
          echo "============================================"
          echo "  Fixing SUSFS/KSU missing symbols (v9)"
          echo "============================================"

          KSU_DIR="${{ env.KSU_DIR }}"
          [ -z "$KSU_DIR" ] && { echo "KSU_DIR not set"; exit 1; }

          # ── 1. Create comprehensive compat header ──
          echo ">>> Creating include/linux/susfs_compat.h ..."
          cat > include/linux/susfs_compat.h << 'COMPAT_H_EOF'
          /* SPDX-License-Identifier: GPL-2.0 */
          /* susfs_compat.h — Auto-generated SUSFS API compat for SukiSU-Ultra v4.x */
          #ifndef _LINUX_SUSFS_COMPAT_H
          #define _LINUX_SUSFS_COMPAT_H

          #include <linux/types.h>
          #include <linux/errno.h>

          /* ── Missing CMD defines ── */
          #ifndef SUSFS_MAGIC
          #define SUSFS_MAGIC 0x535553
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x60012
          #endif
          #ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x60020
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_MAP
          #define CMD_SUSFS_ADD_SUS_MAP 0x60030
          #endif
          #ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x60040
          #endif

          /* ── Missing function stubs ── */
          static inline int susfs_add_sus_path_loop(void *a) { return -ENOSYS; }
          static inline int susfs_set_hide_sus_mnts_for_non_su_procs(void *a) { return 0; }
          static inline void susfs_start_sdcard_monitor_fn(void) { }
          static inline int susfs_add_sus_map(void *a) { return -ENOSYS; }
          static inline int susfs_set_avc_log_spoofing(void *a) { return 0; }
          static inline int susfs_enable_log(void *a) { return 0; }

          /* ── Utility functions ── */
          static inline bool susfs_starts_with(const char *s, const char *p) {
              return s && p && strncmp(s, p, __builtin_strlen(p)) == 0;
          }
          static inline bool susfs_ends_with(const char *s, const char *x) {
              size_t sl, xl;
              if (!s || !x) return false;
              sl = __builtin_strlen(s); xl = __builtin_strlen(x);
              return xl <= sl && __builtin_strcmp(s + sl - xl, x) == 0;
          }
          static inline bool susfs_is_current_proc_umounted(void) { return false; }
          static inline void susfs_set_current_proc_umounted(void) { }
          static inline int susfs_show_variant(void *a) { return 0; }
          static inline int susfs_show_version(void *a) { return 0; }

          /* ── KSU SELinux hide ── */
          static inline void ksu_selinux_hide_handle_post_fs_data(void) { }
          static inline void ksu_selinux_hide_handle_second_stage(void) { }

          #endif /* _LINUX_SUSFS_COMPAT_H */
          COMPAT_H_EOF
          # Remove leading spaces from heredoc
          sed -i 's/^          //' include/linux/susfs_compat.h
          echo "    ✅ Created susfs_compat.h"

          # ── 2. Include compat header in KSU source (ksu.c) ──
          echo ">>> Injecting compat include into KSU..."
          KSU_C="$KSU_DIR/ksu.c"
          if [ -f "$KSU_C" ]; then
            if ! grep -q "susfs_compat.h" "$KSU_C"; then
              # Add include right after the last #include line
              LAST_INCLUDE=$(grep -n "^#include" "$KSU_C" | tail -1 | cut -d: -f1)
              if [ -n "$LAST_INCLUDE" ]; then
                sed -i "${LAST_INCLUDE}a\\
          #include <linux/susfs_compat.h>" "$KSU_C"
                echo "    ✅ Added #include <linux/susfs_compat.h> to ksu.c"
              fi
            else
              echo "    ✅ Already included"
            fi
          fi

          # Also include in any file that directly includes dispatch.c
          for f in $(grep -rl "dispatch.c" "$KSU_DIR" --include="*.c" 2>/dev/null); do
            if ! grep -q "susfs_compat.h" "$f"; then
              LAST_INC=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
              [ -n "$LAST_INC" ] && sed -i "${LAST_INC}a\\
          #include <linux/susfs_compat.h>" "$f"
              echo "    ✅ Added compat include to $(basename $f)"
            fi
          done

          # ── 3. Fix void* pointer casts in dispatch.c ──
          echo ">>> Fixing pointer casts in dispatch.c..."
          DISPATCH=$(find "$KSU_DIR" -name "dispatch.c" -type f | head -1)
          if [ -f "$DISPATCH" ]; then
            # Cast void* arg to expected struct types
            sed -i 's/susfs_add_sus_path(arg)/susfs_add_sus_path((struct st_susfs_sus_path __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_add_sus_kstat(arg)/susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_update_sus_kstat(arg)/susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_add_sus_kstat_statically(arg)/susfs_add_sus_kstat_statically((struct st_susfs_sus_kstat_statically __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_set_uname(arg)/susfs_set_uname((struct st_susfs_uname __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_add_open_redirect(arg)/susfs_add_open_redirect((struct st_susfs_open_redirect __user *)arg)/g' "$DISPATCH"
            sed -i 's/susfs_set_cmdline_or_bootconfig(arg)/susfs_set_cmdline_or_bootconfig((char __user *)arg)/g' "$DISPATCH"

            # Fix susfs_get_enabled_features: 1 arg → 2 args
            sed -i 's/susfs_get_enabled_features(arg)/susfs_get_enabled_features((char __user *)arg, 4096)/g' "$DISPATCH"

            echo "    ✅ dispatch.c patched"
          else
            echo "    ⚠️ dispatch.c not found"
          fi

          # ── 4. Fix strncpy_from_user_nofault ──
          echo ">>> Fixing strncpy_from_user_nofault..."
          COMPAT_KH=$(find "$KSU_DIR" -name "kernel_compat.h" -type f | head -1)
          if [ -f "$COMPAT_KH" ]; then
            if grep -q "__strncpy_from_user_nofault" "$COMPAT_KH" && \
               ! grep -q "^#define strncpy_from_user_nofault" "$COMPAT_KH"; then
              echo "" >> "$COMPAT_KH"
              echo "#ifndef strncpy_from_user_nofault" >> "$COMPAT_KH"
              echo "#define strncpy_from_user_nofault __strncpy_from_user_nofault" >> "$COMPAT_KH"
              echo "#endif" >> "$COMPAT_KH"
              echo "    ✅ Added strncpy_from_user_nofault define"
            else
              echo "    ✅ Already defined or not needed"
            fi
          fi

          # ── 5. Verify ──
          echo ""
          echo ">>> Files modified:"
          [ -f "include/linux/susfs_compat.h" ] && echo "    ✅ include/linux/susfs_compat.h"
          grep -l "susfs_compat.h" "$KSU_DIR/"*.c 2>/dev/null | while read f; do
            echo "    ✅ $(basename $f) includes compat header"
          done

          echo ""
          echo "============================================"
          echo "  SUSFS/KSU symbol fix complete."
          echo "============================================"

      - name: Handle SUSFS disabled
        if: ${{ github.event.inputs.ENABLE_SUSFS != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p include/linux
          echo -e "#ifndef _LINUX_SUSFS_H\n#define _LINUX_SUSFS_H\n#endif" > include/linux/susfs.h

      - name: Apply manual hook patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x $GITHUB_WORKSPACE/apply_hooks.sh
          bash $GITHUB_WORKSPACE/apply_hooks.sh

      - name: Fix vendor code build errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> Fixing vendor code..."
          F="techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/rmnet_ipa.c"
          [ -f "$F" ] && {
            sed -i 's/q6_ul_flt_rule_ptr->ip = flt_spec_ptr->ip_type;/q6_ul_flt_rule_ptr->ip = (enum ipa_ip_type)flt_spec_ptr->ip_type;/g' "$F"
            sed -i 's/q6_ul_flt_rule_ptr->action = flt_spec_ptr->filter_action;/q6_ul_flt_rule_ptr->action = (enum ipa_flt_action)flt_spec_ptr->filter_action;/g' "$F"
            echo "    [OK] rmnet_ipa.c"
          }
          for f in techpack/display/msm/sde/sde_hw_dsc_1_2.c techpack/display/msm/sde/sde_hw_vdc.c; do
            [ -f "$f" ] && sed -i 's/^static inline _\([a-z]*\)_subblk_offset/static inline int _\1_subblk_offset/g' "$f" && echo "    [OK] $(basename $f)"
          done
          find techpack/display -name "*.c" -exec grep -l "^static inline _.*_subblk_offset" {} \; 2>/dev/null | while read f; do
            sed -i 's/^static inline _\([a-z]*\)_subblk_offset/static inline int _\1_subblk_offset/g' "$f"
          done
          TCP_MK="net/ipv4/Makefile"
          [ -f "$TCP_MK" ] && ! grep -q "Wno-single-bit-bitfield" "$TCP_MK" && {
            echo -e "\nCFLAGS_tcp_timer.o += -Wno-single-bit-bitfield-constant-conversion" >> "$TCP_MK"
            echo "    [OK] tcp_timer.c"
          }

      - name: Update defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DC="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"
          sed -i '/CONFIG_KSU/d; /CONFIG_KPROBES/d; /CONFIG_KPM/d; /CONFIG_KALLSYMS_ALL/d' "$DC"
          {
            echo ""
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KPROBES is not set"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DC"
          [ "${{ github.event.inputs.ENABLE_KPM }}" = "true" ] && echo "CONFIG_KPM=y" >> "$DC"
          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "# CONFIG_KSU_SUSFS_SUS_SU is not set"
            } >> "$DC"
          else
            echo "# CONFIG_KSU_SUSFS is not set" >> "$DC"
          fi
          tail -20 "$DC"

      - name: Build kernel via build.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x build.sh
          export ARCH=arm64 SUBARCH=arm64
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain/clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang LLVM=1 LLVM_IAS=1
          export DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export KERNEL_DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/clang"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain/clang"
          export TC_DIR="$GITHUB_WORKSPACE/toolchain/clang"
          BUILD_START=$(date +%s)
          bash build.sh ${{ github.event.inputs.BUILD_ARGS }} 2>&1 | tee $GITHUB_WORKSPACE/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo ">>> Build: $(( ($(date +%s)-BUILD_START)/60 ))m (exit: $BUILD_RC)"
          [ $BUILD_RC -ne 0 ] && { echo "::error::Build FAILED!"; exit $BUILD_RC; }

      - name: Locate kernel image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          for d in "out/arch/arm64/boot" "arch/arm64/boot" "out/dist"; do
            for img in Image Image.gz Image.gz-dtb; do
              [ -f "$d/$img" ] && { echo "KERNEL_IMAGE=$(realpath $d/$img)" >> $GITHUB_ENV; break 2; }
            done
          done
          [ -z "${KERNEL_IMAGE:-}" ] && { echo "::error::No kernel image!"; exit 1; }

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "${{ github.event.inputs.ANYKERNEL_REPO }}" $GITHUB_WORKSPACE/AnyKernel3
          cp $GITHUB_WORKSPACE/anykernel.sh $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          cp "$KERNEL_IMAGE" $GITHUB_WORKSPACE/AnyKernel3/
          cd $GITHUB_WORKSPACE/AnyKernel3; rm -rf .git .github LICENSE README.md
          STAG=""; [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ] && STAG="-SUSFS"
          ZIPNAME="SukiSU-Ultra${STAG}-lisa-$(date +%Y%m%d-%H%M)-AnyKernel3.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIPNAME" . -x '*.git*'
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
        env:
          KERNEL_IMAGE: ${{ env.KERNEL_IMAGE }}

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ github.workspace }}/${{ env.ZIPNAME }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
