name: Build SukiSU-Ultra Kernel (lisa)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: "Kernel source repo (must contain build.sh)"
        required: true
        default: "https://github.com/AcmeUI-Devices/android_kernel_xiaomi_lisa"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "main"
      SUKISU_BRANCH:
        description: "SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - builtin
      DEFCONFIG:
        description: "Defconfig (relative to arch/arm64/configs/)"
        required: true
        default: "vendor/lisa_defconfig"
      CLANG_URL:
        description: "Clang toolchain tarball URL"
        required: true
        default: "https://github.com/ZyCromerZ/Clang/releases/download/21.0.0-20250517-release/Clang-21.0.0-20250517.tar.gz"
      BUILD_ARGS:
        description: "Extra build.sh arguments"
        required: false
        default: ""
      ENABLE_KPM:
        description: "Enable KPM"
        required: false
        default: true
        type: boolean
      ENABLE_SUSFS:
        description: "Enable SUSFS"
        required: false
        default: true
        type: boolean
      SUSFS_REPO:
        description: "SUSFS repo (ShirkNeko fork for SukiSU-Ultra)"
        required: false
        default: "https://github.com/ShirkNeko/susfs4ksu"
      SUSFS_BRANCH:
        description: "SUSFS branch (must match kernel version)"
        required: false
        default: "kernel-5.4"
      ANYKERNEL_REPO:
        description: "AnyKernel3 repo"
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git gnupg libelf-dev libssl-dev lld llvm \
            python3 python-is-python3 zip unzip wget \
            device-tree-compiler gcc-aarch64-linux-gnu

      - name: Setup Clang toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain/clang
          wget -q "${{ github.event.inputs.CLANG_URL }}" -O clang.tar.gz
          tar -xf clang.tar.gz -C $GITHUB_WORKSPACE/toolchain/clang --strip-components=1
          rm -f clang.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/toolchain/clang/bin/clang --version || true

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_REPO }}" \
            $GITHUB_WORKSPACE/kernel
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV
          [ -f "$GITHUB_WORKSPACE/kernel/build.sh" ] || { echo "::error::build.sh not found!"; exit 1; }

      - name: Integrate SukiSU-Ultra
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.SUKISU_BRANCH }}"

          if [ -d "drivers/kernelsu" ]; then
            echo "KSU_DIR=drivers/kernelsu" >> $GITHUB_ENV
          elif [ -d "KernelSU/kernel" ]; then
            echo "KSU_DIR=KernelSU/kernel" >> $GITHUB_ENV
          else
            echo "KSU_DIR=" >> $GITHUB_ENV
          fi

      # ════════════════════════════════════════════
      # SUSFS Integration
      # ════════════════════════════════════════════
      - name: Integrate SUSFS
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> Integrating SUSFS (${{ github.event.inputs.SUSFS_BRANCH }})..."

          git clone --depth=1 -b "${{ github.event.inputs.SUSFS_BRANCH }}" \
            "${{ github.event.inputs.SUSFS_REPO }}" \
            $GITHUB_WORKSPACE/susfs4ksu
          SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"

          # ── Copy ALL SUSFS source files ──
          echo ">>> Copying SUSFS source files..."

          # Copy ALL files from kernel_patches/fs/
          if [ -d "$SUSFS_DIR/kernel_patches/fs" ]; then
            cp -rv "$SUSFS_DIR/kernel_patches/fs/"* fs/
            echo "    ✅ fs/ files copied"
          fi

          # Copy ALL files from kernel_patches/include/ (susfs.h AND susfs_def.h)
          if [ -d "$SUSFS_DIR/kernel_patches/include" ]; then
            cp -rv "$SUSFS_DIR/kernel_patches/include/"* include/
            echo "    ✅ include/ files copied"
          fi

          # Verify ALL susfs headers exist
          echo ">>> Checking susfs headers:"
          ls -la include/linux/susfs* 2>/dev/null || echo "    ⚠️ No susfs headers found"

          # ── Apply KSU SUSFS patch ──
          echo ""
          echo ">>> Applying SUSFS KSU patches..."
          KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches/KernelSU"
          [ ! -d "$KSU_PATCH_DIR" ] && KSU_PATCH_DIR="$SUSFS_DIR/kernel_patches"

          KSU_APPLIED=false
          for patch_file in \
            "$KSU_PATCH_DIR/10_enable_susfs_for_ksu.patch" \
            "$KSU_PATCH_DIR/"*enable_susfs*.patch; do
            [ -f "$patch_file" ] || continue
            echo "    >>> Trying: $(basename $patch_file)"
            if [ -n "$KSU_DIR" ]; then
              if git apply --check --directory="$KSU_DIR" "$patch_file" 2>/dev/null; then
                git apply --directory="$KSU_DIR" "$patch_file"
                echo "    ✅ Applied to $KSU_DIR"; KSU_APPLIED=true; break
              fi
              if git apply --check "$patch_file" 2>/dev/null; then
                git apply "$patch_file"
                echo "    ✅ Applied (full path)"; KSU_APPLIED=true; break
              fi
              echo "    ⚠️ Trying --reject..."
              git apply --reject "$patch_file" 2>/dev/null || true
              KSU_APPLIED=true; break
            fi
          done
          [ "$KSU_APPLIED" = false ] && echo "    ⚠️ No KSU patch applied (may be built-in)"

          # ── Apply kernel SUSFS patch ──
          echo ""
          echo ">>> Applying kernel SUSFS patches..."
          for patch_file in \
            "$SUSFS_DIR/kernel_patches/50_add_susfs_in_kernel-5.4.patch" \
            "$SUSFS_DIR/kernel_patches/"*add_susfs*.patch \
            "$SUSFS_DIR/kernel_patches/"*kernel*.patch; do
            [ -f "$patch_file" ] || continue
            echo "$patch_file" | grep -qiE "ksu|enable_susfs_for_ksu" && continue
            echo "    >>> Trying: $(basename $patch_file)"
            if git apply --check "$patch_file" 2>/dev/null; then
              git apply "$patch_file"
              echo "    ✅ Applied"
            else
              echo "    ⚠️ Trying --reject..."
              git apply --reject "$patch_file" 2>/dev/null || true
            fi
          done

          # ── Verify ──
          echo ""
          echo ">>> Verification:"
          [ -f "include/linux/susfs.h" ] && echo "    ✅ susfs.h" || echo "    ❌ susfs.h MISSING"
          [ -f "include/linux/susfs_def.h" ] && echo "    ✅ susfs_def.h" || echo "    ⚠️ susfs_def.h not found (may not exist in this version)"
          [ -f "fs/susfs.c" ] && echo "    ✅ susfs.c" || echo "    ❌ susfs.c MISSING"

          REJ_FILES=$(find . -name "*.rej" 2>/dev/null)
          if [ -n "$REJ_FILES" ]; then
            echo "    ⚠️ Rejected hunks:"
            echo "$REJ_FILES" | while read f; do echo "      - $f"; done
          fi

      - name: Handle SUSFS header (disabled)
        if: ${{ github.event.inputs.ENABLE_SUSFS != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p include/linux
          echo -e "#ifndef _LINUX_SUSFS_H\n#define _LINUX_SUSFS_H\n#endif" > include/linux/susfs.h

      - name: Apply manual hook patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x $GITHUB_WORKSPACE/apply_hooks.sh
          bash $GITHUB_WORKSPACE/apply_hooks.sh

      # ════════════════════════════════════════════
      # Fix ALL vendor code build errors
      # ════════════════════════════════════════════
      - name: Fix vendor code build errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -e
          echo ">>> Fixing vendor code build errors..."

          # FIX 1: rmnet_ipa.c enum conversion (-Werror,-Wenum-conversion)
          RMNET_IPA="techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/rmnet_ipa.c"
          if [ -f "$RMNET_IPA" ]; then
            sed -i 's/q6_ul_flt_rule_ptr->ip = flt_spec_ptr->ip_type;/q6_ul_flt_rule_ptr->ip = (enum ipa_ip_type)flt_spec_ptr->ip_type;/g' "$RMNET_IPA"
            sed -i 's/q6_ul_flt_rule_ptr->action = flt_spec_ptr->filter_action;/q6_ul_flt_rule_ptr->action = (enum ipa_flt_action)flt_spec_ptr->filter_action;/g' "$RMNET_IPA"
            echo "    [OK] rmnet_ipa.c enum casts"
          fi

          # FIX 2: sde_hw_dsc_1_2.c missing return type (-Werror,-Wimplicit-int)
          SDE_DSC="techpack/display/msm/sde/sde_hw_dsc_1_2.c"
          if [ -f "$SDE_DSC" ]; then
            sed -i 's/^static inline _dsc_subblk_offset/static inline int _dsc_subblk_offset/g' "$SDE_DSC"
            echo "    [OK] sde_hw_dsc_1_2.c return type"
          fi

          # FIX 3 (NEW): sde_hw_vdc.c missing return type (-Werror,-Wimplicit-int)
          SDE_VDC="techpack/display/msm/sde/sde_hw_vdc.c"
          if [ -f "$SDE_VDC" ]; then
            sed -i 's/^static inline _vdc_subblk_offset/static inline int _vdc_subblk_offset/g' "$SDE_VDC"
            echo "    [OK] sde_hw_vdc.c return type"
          fi

          # FIX 4 (NEW): tcp_timer.c 1-bit bitfield truncation (-Werror,-Wsingle-bit-bitfield-constant-conversion)
          TCP_TIMER="net/ipv4/tcp_timer.c"
          if [ -f "$TCP_TIMER" ]; then
            # icsk->icsk_mtup.enabled = 1; → change to unsigned-safe assignment
            sed -i 's/icsk->icsk_mtup\.enabled = 1;/icsk->icsk_mtup.enabled = (unsigned)1;/g' "$TCP_TIMER"
            echo "    [OK] tcp_timer.c bitfield fix"
          fi

          # FIX 4b: Alternative — fix the struct definition to use unsigned
          # If the struct uses 'signed int enabled:1', change it to 'unsigned int enabled:1'
          for header in include/net/inet_connection_sock.h include/linux/tcp.h; do
            if [ -f "$header" ] && grep -q "enabled:1" "$header"; then
              # Check if it's signed (no unsigned keyword before it)
              if grep -qP '^\s+(?!unsigned)\w+\s+enabled\s*:\s*1' "$header" 2>/dev/null; then
                echo "    [INFO] Found signed bitfield in $header (may need manual fix)"
              fi
            fi
          done

          # FIX 5: Catch-all — fix ALL missing return types in techpack/display
          # Some sde_hw_*.c files may have the same pattern
          find techpack/display -name "*.c" -exec grep -l "^static inline _.*_subblk_offset" {} \; 2>/dev/null | while read f; do
            sed -i 's/^static inline _\([a-z]*\)_subblk_offset/static inline int _\1_subblk_offset/g' "$f"
            echo "    [OK] $(basename $f) return type (catch-all)"
          done

          echo ">>> All vendor fixes applied."

      - name: Update defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"
          echo ">>> Updating defconfig: $DEFCONFIG_PATH"

          sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KPROBES/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KPM/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KALLSYMS_ALL/d' "$DEFCONFIG_PATH"

          {
            echo ""
            echo "# --- SukiSU-Ultra ---"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "# CONFIG_KPROBES is not set"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DEFCONFIG_PATH"

          if [ "${{ github.event.inputs.ENABLE_KPM }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
          fi

          if [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ]; then
            {
              echo "# --- SUSFS ---"
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
              echo "# CONFIG_KSU_SUSFS_SUS_SU is not set"
            } >> "$DEFCONFIG_PATH"
            echo ">>> SUSFS enabled (SUS_SU disabled for manual hooks)."
          else
            echo "# CONFIG_KSU_SUSFS is not set" >> "$DEFCONFIG_PATH"
            echo ">>> SUSFS disabled."
          fi

          echo "--- Tail of defconfig ---"
          tail -25 "$DEFCONFIG_PATH"

      - name: Build kernel via build.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          chmod +x build.sh

          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH="$GITHUB_WORKSPACE/toolchain/clang/bin"
          export PATH="$CLANG_PATH:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export KERNEL_DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          export TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/clang"
          export CLANG_DIR="$GITHUB_WORKSPACE/toolchain/clang"
          export TC_DIR="$GITHUB_WORKSPACE/toolchain/clang"

          BUILD_START=$(date +%s)
          bash build.sh ${{ github.event.inputs.BUILD_ARGS }} 2>&1 | tee $GITHUB_WORKSPACE/build.log
          BUILD_RC=${PIPESTATUS[0]}
          BUILD_END=$(date +%s)
          echo ">>> Build time: $(( (BUILD_END-BUILD_START)/60 ))m $(( (BUILD_END-BUILD_START)%60 ))s (exit: $BUILD_RC)"
          [ $BUILD_RC -ne 0 ] && { echo "::error::Build FAILED!"; exit $BUILD_RC; }

      - name: Locate kernel image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KERNEL_IMAGE=""
          for d in "out/arch/arm64/boot" "arch/arm64/boot" "out/dist"; do
            for img in Image Image.gz Image.gz-dtb; do
              [ -f "$d/$img" ] && KERNEL_IMAGE="$(realpath "$d/$img")" && break 2
            done
          done
          [ -z "$KERNEL_IMAGE" ] && { echo "::error::No kernel image!"; find . -name "Image*" -type f 2>/dev/null | head -10; exit 1; }
          echo ">>> ✅ $KERNEL_IMAGE ($(du -h "$KERNEL_IMAGE" | cut -f1))"
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> $GITHUB_ENV
          echo "OUT_BASE=$(dirname "$(dirname "$(dirname "$KERNEL_IMAGE")")")" >> $GITHUB_ENV

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 "${{ github.event.inputs.ANYKERNEL_REPO }}" $GITHUB_WORKSPACE/AnyKernel3
          cp $GITHUB_WORKSPACE/anykernel.sh $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh
          cp "$KERNEL_IMAGE" $GITHUB_WORKSPACE/AnyKernel3/
          for d in "$OUT_BASE/arch/arm64/boot/dts" "$KERNEL_DIR/out/arch/arm64/boot/dts"; do
            [ -d "$d" ] && find "$d" -name "*.dtb" -exec cp {} $GITHUB_WORKSPACE/AnyKernel3/ \; 2>/dev/null && break
          done
          for f in "$OUT_BASE/arch/arm64/boot/dtbo.img" "$KERNEL_DIR/out/arch/arm64/boot/dtbo.img"; do
            [ -f "$f" ] && cp "$f" $GITHUB_WORKSPACE/AnyKernel3/ && break
          done
          cd $GITHUB_WORKSPACE/AnyKernel3; rm -rf .git .github LICENSE README.md
          SUSFS_TAG=""; [ "${{ github.event.inputs.ENABLE_SUSFS }}" = "true" ] && SUSFS_TAG="-SUSFS"
          ZIPNAME="SukiSU-Ultra${SUSFS_TAG}-lisa-$(date +%Y%m%d-%H%M)-AnyKernel3.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIPNAME" . -x '*.git*'
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
        env:
          KERNEL_DIR: ${{ env.KERNEL_DIR }}
          KERNEL_IMAGE: ${{ env.KERNEL_IMAGE }}
          OUT_BASE: ${{ env.OUT_BASE }}

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ github.workspace }}/${{ env.ZIPNAME }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
