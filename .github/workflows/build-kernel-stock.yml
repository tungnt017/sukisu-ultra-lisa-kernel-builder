name: Build Xiaomi Lisa Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: PixelExperience-Devices/kernel_xiaomi_lisa
          ref: thirteen
          fetch-depth: 1
          path: kernel

      - name: Show files
        run: |
          pwd
          ls -la
          echo "Kernel folder:"
          ls -la kernel

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            python-is-python3 \
            zip \
            unzip \
            xz-utils

      - name: Make build script executable
        working-directory: kernel
        run: |
          chmod +x build.sh

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export USE_CCACHE=1

          ./build.sh

      - name: Find build outputs
        if: always()
        working-directory: kernel
        run: |
          find . -type f \( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "Image.gz-dtb" -o \
            -name "*.dtb" -o \
            -name "dtbo.img" -o \
            -name "*.ko" -o \
            -name "*.zip" \
          \) -print || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaomi-lisa-kernel
          path: |
            kernel/**/Image
            kernel/**/Image.gz
            kernel/**/Image.gz-dtb
            kernel/**/*.dtb
            kernel/**/dtbo.img
            kernel/**/*.ko
            kernel/**/*.zip
          if-no-files-found: warn
